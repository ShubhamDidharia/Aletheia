# Local Redis for the thought stream, execution checkpoints and search caching.
#   docker compose up -d
# Then set REDIS_URL=redis://localhost:6379 in backend/.env
services:
  redis:
    image: redis:7-alpine
    container_name: aletheia-redis
    # Come back automatically after a Docker Desktop restart or a reboot —
    # a stopped Redis makes the whole app look broken.
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
